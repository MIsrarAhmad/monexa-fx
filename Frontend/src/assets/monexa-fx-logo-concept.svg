      <stop offset=".46" stop-color="#79dfff"/>
      <stop offset="1" stop-color="#1685ff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="57" y1="226" x2="248" y2="151" gradientUnits="userSpaceOnUse">
