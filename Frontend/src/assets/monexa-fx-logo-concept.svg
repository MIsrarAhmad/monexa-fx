<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Monexa FX — Premium Bull logo concept</title>
  <desc id="description">A polished blue bull and rising market arrow inside a globe, paired with the Monexa FX wordmark.</desc>
  <defs>
    <linearGradient id="frame" x1="30" y1="24" x2="274" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92e7ff"/>
      <stop offset=".34" stop-color="#0788ff"/>
      <stop offset=".7" stop-color="#164bca"/>
      <stop offset="1" stop-color="#65dcff"/>
    </linearGradient>
    <linearGradient id="bull" x1="78" y1="58" x2="236" y2="214" gradientUnits="userSpaceOnUse">
